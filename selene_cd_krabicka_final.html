<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELÉNÉ — Darčeková krabička K1 · Finálny mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAF6F0; --champagne:#EDE3D2;
  --gold:#A98A57; --gold-deep:#8F7245;
  --ink:#2B2723; --muted:#7C7266;
  --line:rgba(43,39,35,.10);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
  --pad:clamp(20px,5vw,72px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased}
svg{display:block;max-width:100%;overflow:visible}

/* Logo */
.brand{padding:clamp(30px,5vw,52px) var(--pad) clamp(10px,2vw,18px);display:flex;flex-direction:column;align-items:center;gap:4px}
.brand svg{width:28px;height:28px;margin-bottom:4px}
.brand .b{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.32em;padding-left:.32em;color:var(--ink)}
.brand .t{font-size:9px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--gold-deep)}

main{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,44px) var(--pad) clamp(60px,8vw,110px)}

/* Hero — closed box */
.hero{display:flex;justify-content:center;padding:clamp(10px,3vw,30px) 0 clamp(30px,5vw,56px)}
.hero .frame{width:min(480px,86vw)}

/* Pair row — open + detail */
.pair{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(24px,4vw,56px);align-items:center}
@media (max-width:760px){.pair{grid-template-columns:1fr;justify-items:center}}
.pair .frame{width:100%}
.pair .frame.detail-frame{max-width:300px;justify-self:center}
.pair .frame.open-frame{max-width:520px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="soft-shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft-shadow-sm" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <pattern id="linen" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2B2723" stroke-width=".5" opacity=".05"/>
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#FFFFFF" stroke-width=".5" opacity=".06"/>
    </pattern>
  </defs>
</svg>

<div class="brand">
  <svg viewBox="0 0 48 48" fill="none"><path d="M30 6C19 9 12 18.5 12 24C12 29.5 19 39 30 42C24.6 38.5 21 32 21 24C21 16 24.6 9.5 30 6Z" stroke="#A98A57" stroke-width="1.4"/></svg>
  <span class="b">SELÉNÉ</span>
  <span class="t">jewelry</span>
</div>

<main>

  <!-- ===================== HERO — ZATVORENÁ ===================== -->
  <div class="hero">
    <div class="frame">
      <svg class="box-svg" viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zatvorená darčeková krabička SELÉNÉ, ivory a champagne, so zlatou stuhou">
        <defs>
          <clipPath id="kc-top"><polygon points="70,70 255,45 300,120 115,145"/></clipPath>
          <clipPath id="kc-lidR"><polygon points="255,45 300,120 300,138 255,63"/></clipPath>
          <clipPath id="kc-lidF"><polygon points="115,145 300,120 300,138 115,163"/></clipPath>
          <clipPath id="kc-baseR"><polygon points="255,63 300,138 300,152 255,77"/></clipPath>
          <clipPath id="kc-baseF"><polygon points="115,163 300,138 300,152 115,177"/></clipPath>
        </defs>

        <ellipse cx="190" cy="273" rx="122" ry="19" fill="#2B2723" opacity=".17" filter="url(#soft-shadow)"/>

        <!-- ivory base reveal -->
        <polygon points="255,63 300,138 300,152 255,77" fill="#E7DECE"/>
        <rect x="240" y="55" width="72" height="105" fill="url(#linen)" clip-path="url(#kc-baseR)" opacity=".5"/>
        <polygon points="115,163 300,138 300,152 115,177" fill="#F2ECE0"/>
        <rect x="100" y="130" width="212" height="55" fill="url(#linen)" clip-path="url(#kc-baseF)" opacity=".5"/>
        <polygon points="255,63 300,138 300,152 255,77" fill="none" stroke="#DCD0BC" stroke-width="1"/>
        <polygon points="115,163 300,138 300,152 115,177" fill="none" stroke="#DCD0BC" stroke-width="1"/>

        <!-- champagne lid -->
        <polygon points="255,45 300,120 300,138 255,63" fill="#D8C9A8"/>
        <rect x="240" y="35" width="72" height="110" fill="url(#linen)" clip-path="url(#kc-lidR)" opacity=".45"/>
        <polygon points="115,145 300,120 300,138 115,163" fill="#E4D7BC"/>
        <rect x="100" y="110" width="212" height="60" fill="url(#linen)" clip-path="url(#kc-lidF)" opacity=".45"/>
        <polygon points="70,70 255,45 300,120 115,145" fill="#EDE3D2"/>
        <rect x="60" y="35" width="250" height="120" fill="url(#linen)" clip-path="url(#kc-top)" opacity=".45"/>
        <polygon points="95,88 190,63 215,75 120,100" fill="#FFFFFF" opacity=".10" clip-path="url(#kc-top)"/>
        <polygon points="70,70 255,45 300,120 115,145" fill="none" stroke="#C9B896" stroke-width="1"/>
        <polygon points="115,145 300,120 300,138 115,163" fill="none" stroke="#C9B896" stroke-width="1"/>

        <!-- satin ribbon -->
        <g transform="matrix(1.85,-0.25,0.45,0.75,70,70)">
          <rect x="41" y="-4" width="18" height="150" fill="#A98A57"/>
          <rect x="41" y="-4" width="6" height="150" fill="#8F7245" opacity=".45"/>
          <rect x="55" y="-4" width="4" height="150" fill="#FBF4E4" opacity=".35"/>
        </g>
        <g transform="matrix(1.85,-0.25,0,0.34,115,145)">
          <rect x="41" y="-2" width="18" height="140" fill="#A98A57"/>
          <rect x="53" y="-2" width="6" height="140" fill="#8F7245" opacity=".4"/>
        </g>

        <!-- gold foil stamp: kosák + hviezda -->
        <g transform="matrix(1.85,-0.25,0.45,0.75,70,70)">
          <g transform="translate(24,20) scale(1.3)">
            <path d="M30 6C19 9 12 18.5 12 24C12 29.5 19 39 30 42C24.6 38.5 21 32 21 24C21 16 24.6 9.5 30 6Z" fill="#8F7245"/>
            <path d="M27 10C20 13.5 16 19 16 24C16 29 20 34.5 27 38C23 34 21 29.5 21 24C21 18.5 23 14 27 10Z" fill="#C4A876" opacity=".45"/>
            <path d="M38 14 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 Z" fill="#8F7245"/>
            <path d="M38 14 l1.6 4.2 4.2 1.6 -4.2 1.6" fill="none" stroke="#C4A876" stroke-width=".5" opacity=".5"/>
          </g>
        </g>

        <!-- bow -->
        <g>
          <path d="M205,129 C177,115 175,143 205,131 Z" fill="#A98A57"/>
          <path d="M205,129 C233,115 235,143 205,131 Z" fill="#A98A57"/>
          <path d="M205,129 C182,119 181,138 205,130 Z" fill="#8F7245" opacity=".3"/>
          <path d="M205,129 C228,119 229,138 205,130 Z" fill="#8F7245" opacity=".3"/>
          <path d="M195,120 C185,116 183,126 197,124 Z" fill="#FBF4E4" opacity=".35"/>
          <path d="M215,120 C225,116 227,126 213,124 Z" fill="#FBF4E4" opacity=".3"/>
          <rect x="199" y="123" width="12" height="14" rx="3" fill="#8F7245"/>
          <path d="M201,133 L189,178 L199,171 Z" fill="#A98A57"/>
          <path d="M209,133 L221,178 L211,171 Z" fill="#A98A57"/>
          <path d="M201,133 L189,178 L193,176 L203,136 Z" fill="#8F7245" opacity=".22"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ===================== PÁR — OTVORENÁ + DETAIL ===================== -->
  <div class="pair">

    <div class="frame open-frame">
      <svg class="box-svg" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Otvorená darčeková krabička s hodvábnym papierom a náhrdelníkom so zlatým príveskom">
        <defs>
          <filter id="ko-sh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
          <clipPath id="ko-cot"><rect x="0" y="0" width="100" height="100"/></clipPath>
          <clipPath id="ko-R"><polygon points="255,35 300,110 300,195 255,120"/></clipPath>
          <clipPath id="ko-F"><polygon points="115,135 300,110 300,195 115,220"/></clipPath>
          <clipPath id="ko-baseR"><polygon points="255,120 300,195 300,208 255,133"/></clipPath>
          <clipPath id="ko-baseF"><polygon points="115,220 300,195 300,208 115,233"/></clipPath>
        </defs>

        <ellipse cx="195" cy="258" rx="120" ry="18" fill="#2B2723" opacity=".16" filter="url(#ko-sh)"/>
        <ellipse cx="278" cy="72" rx="44" ry="9" fill="#2B2723" opacity=".08"/>

        <!-- tilted lid, resting open -->
        <polygon points="240,18 318,36 306,78 230,60" fill="#F1EADC" stroke="#C9B896" stroke-width="1"/>
        <g transform="matrix(0.62,0.09,-0.09,0.34,240,18)">
          <g transform="translate(24,18) scale(1.15)">
            <path d="M30 6C19 9 12 18.5 12 24C12 29.5 19 39 30 42C24.6 38.5 21 32 21 24C21 16 24.6 9.5 30 6Z" fill="#8F7245" opacity=".85"/>
            <path d="M38 14 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 Z" fill="#8F7245" opacity=".85"/>
          </g>
        </g>

        <!-- box shell -->
        <polygon points="255,35 300,110 300,195 255,120" fill="#DED0B5"/>
        <rect x="240" y="25" width="70" height="180" fill="url(#linen)" clip-path="url(#ko-R)" opacity=".4"/>
        <polygon points="115,135 300,110 300,195 115,220" fill="#F1EADC"/>
        <rect x="100" y="100" width="210" height="130" fill="url(#linen)" clip-path="url(#ko-F)" opacity=".4"/>
        <polygon points="70,60 255,35 300,110 115,135" fill="#DED0B5"/>

        <!-- ivory base reveal -->
        <polygon points="255,120 300,195 300,208 255,133" fill="#E7DECE"/>
        <rect x="240" y="112" width="70" height="105" fill="url(#linen)" clip-path="url(#ko-baseR)" opacity=".45"/>
        <polygon points="115,220 300,195 300,208 115,233" fill="#F2ECE0"/>
        <rect x="100" y="187" width="210" height="55" fill="url(#linen)" clip-path="url(#ko-baseF)" opacity=".45"/>

        <!-- silk tissue + necklace -->
        <g transform="matrix(1.85,-0.25,0.45,0.75,70,60)">
          <g clip-path="url(#ko-cot)">
            <path d="M-5,22 Q15,6 35,20 Q55,4 75,18 Q95,6 105,22 L105,105 L-5,105 Z" fill="#FBF8F3"/>
            <path d="M-5,38 Q20,24 40,36 Q60,20 80,34 Q100,24 105,38 L105,105 L-5,105 Z" fill="#F4EFE6"/>
            <path d="M5,28 Q20,17 34,25" stroke="#E4DACB" stroke-width="1" fill="none" opacity=".6"/>
            <path d="M45,22 Q60,12 74,20" stroke="#E4DACB" stroke-width="1" fill="none" opacity=".6"/>
            <path d="M8,44 Q24,32 40,42" stroke="#E4DACB" stroke-width="1" fill="none" opacity=".5"/>
          </g>
          <path d="M18,10 C34,24 24,40 40,50 S 58,64 50,80" stroke="#A98A57" stroke-width="1.4" fill="none"/>
          <circle cx="18" cy="10" r="1.6" fill="none" stroke="#8F7245" stroke-width="1"/>
          <circle cx="50" cy="80" r="2" fill="none" stroke="#8F7245" stroke-width="1.2"/>
          <g transform="translate(43,81) scale(0.6)">
            <path d="M30 6C19 9 12 18.5 12 24C12 29.5 19 39 30 42C24.6 38.5 21 32 21 24C21 16 24.6 9.5 30 6Z" fill="#8F7245"/>
            <path d="M27 10C20 13.5 16 19 16 24C16 29 20 34.5 27 38C23 34 21 29.5 21 24C21 18.5 23 14 27 10Z" fill="#C4A876" opacity=".5"/>
          </g>
          <path d="M58,58 l2,-4.5 l2,4.5 l4.5,2 l-4.5,2 l-2,4.5 l-2,-4.5 l-4.5,-2 Z" fill="#C4A876" opacity=".85"/>
          <path d="M70,44 l1.2,-2.6 l1.2,2.6 l2.6,1.2 l-2.6,1.2 l-1.2,2.6 l-1.2,-2.6 l-2.6,-1.2 Z" fill="#C4A876" opacity=".6"/>
        </g>

        <polygon points="70,60 255,35 300,110 115,135" fill="none" stroke="#8F7245" stroke-width="1" opacity=".4"/>
        <polygon points="115,135 300,110 300,195 115,220" fill="none" stroke="#C9B896" stroke-width="1"/>
        <polygon points="255,120 300,195 300,208 255,133" fill="none" stroke="#DCD0BC" stroke-width="1"/>
        <polygon points="115,220 300,195 300,208 115,233" fill="none" stroke="#DCD0BC" stroke-width="1"/>
      </svg>
    </div>

    <div class="frame detail-frame">
      <svg class="box-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Detail zlatej pečiatky kosák a hviezda na veku krabičky">
        <defs>
          <clipPath id="kd-face"><rect x="0" y="0" width="220" height="220" rx="6"/></clipPath>
        </defs>
        <rect x="0" y="0" width="220" height="220" rx="6" fill="#EDE3D2"/>
        <rect x="0" y="0" width="220" height="220" fill="url(#linen)" opacity=".5" clip-path="url(#kd-face)"/>
        <polygon points="18,18 150,38 172,172 40,150" fill="#FFFFFF" opacity=".05" clip-path="url(#kd-face)"/>
        <ellipse cx="110" cy="114" rx="58" ry="50" fill="#2B2723" opacity=".06" filter="url(#soft-shadow-sm)"/>
        <g transform="translate(58,53) scale(3.15)">
          <path d="M30 6C19 9 12 18.5 12 24C12 29.5 19 39 30 42C24.6 38.5 21 32 21 24C21 16 24.6 9.5 30 6Z" fill="#8F7245"/>
          <path d="M27 10C20 13.5 16 19 16 24C16 29 20 34.5 27 38C23 34 21 29.5 21 24C21 18.5 23 14 27 10Z" fill="#C4A876" opacity=".5"/>
          <path d="M29 7.5C21 11 17 18 17 24" fill="none" stroke="#FBF4E4" stroke-width=".6" opacity=".55"/>
          <path d="M38 14 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 Z" fill="#8F7245"/>
          <path d="M38 14 l1.6 4.2 4.2 1.6" fill="none" stroke="#C4A876" stroke-width=".5" opacity=".6"/>
        </g>
        <rect x="3" y="3" width="214" height="214" rx="5" fill="none" stroke="#00000015" stroke-width="1"/>
      </svg>
    </div>

  </div>

</main>

</body>
</html>
