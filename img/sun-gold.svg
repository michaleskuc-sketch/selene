<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Slnko (Sun Gold) — kruh so 4 dlhými + 4 krátkymi striedavými lúčmi, párový symbol ku kosáku -->
  <circle cx="32" cy="32" r="13" fill="#8F7245"/>
  <g stroke="#8F7245" stroke-width="3" stroke-linecap="round">
    <!-- dlhé lúče (hlavné smery) -->
    <line x1="32" y1="15" x2="32" y2="6"/>
    <line x1="32" y1="49" x2="32" y2="58"/>
    <line x1="15" y1="32" x2="6" y2="32"/>
    <line x1="49" y1="32" x2="58" y2="32"/>
    <!-- krátke lúče (diagonály, striedajúca dĺžka) -->
    <line x1="44" y1="20" x2="47.5" y2="16.5"/>
    <line x1="20" y1="20" x2="16.5" y2="16.5"/>
    <line x1="44" y1="44" x2="47.5" y2="47.5"/>
    <line x1="20" y1="44" x2="16.5" y2="47.5"/>
  </g>
</svg>
