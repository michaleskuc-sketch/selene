<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <!-- SELENÉ astral background – constellation paths, orbits, crescent moon
       Champagne gold #A98A57, thin line-art, background layer (v2 – výraznejší) -->
  <g stroke="#A98A57">
    <!-- Obežné dráhy (planet orbits) -->
    <ellipse cx="960" cy="170" rx="225" ry="72" transform="rotate(-16 960 170)" stroke-width="1.0" stroke-dasharray="2 6"/>
    <ellipse cx="960" cy="170" rx="305" ry="98" transform="rotate(-16 960 170)" stroke-width="0.8" stroke-dasharray="1 9" opacity="0.7"/>
    <!-- Planéta s prstencom -->
    <circle cx="1100" cy="118" r="13" stroke-width="1.3"/>
    <ellipse cx="1100" cy="118" rx="28" ry="6.5" transform="rotate(-22 1100 118)" stroke-width="0.9"/>
    <!-- Mesačný kosák -->
    <path d="M172 128a54 54 0 0 0 0 108 44 44 0 0 1 0-108z" stroke-width="1.2" opacity="0.75"/>
    <!-- Zodiakálny kruh -->
    <circle cx="300" cy="330" r="148" stroke-width="0.9" stroke-dasharray="1 7" opacity="0.62"/>
    <circle cx="300" cy="330" r="196" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.42"/>
    <path d="M300 182 L300 478 M152 330 L448 330" stroke-width="0.6" opacity="0.45"/>
    <!-- Konštelácia I (Cassiopeia) -->
    <path d="M420 640 L482 556 L538 628 L600 528 L656 610" stroke-width="1.0"/>
    <!-- Konštelácia II (Veľký voz) -->
    <path d="M228 780 L292 738 L356 750 L398 706 L456 718 L524 676" stroke-width="1.0"/>
    <path d="M524 676 L560 724" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.85"/>
    <!-- Konštelácia III -->
    <path d="M742 396 L806 352 L870 412 L924 358" stroke-width="1.0"/>
    <!-- Malá konštelácia -->
    <path d="M600 780 L648 742 L700 772" stroke-width="0.8" opacity="0.85"/>
  </g>
  <!-- Hviezdy (body) -->
  <g fill="#A98A57">
    <circle cx="420" cy="640" r="2.4"/><circle cx="482" cy="556" r="2.8"/><circle cx="538" cy="628" r="2.2"/><circle cx="600" cy="528" r="2.6"/><circle cx="656" cy="610" r="2.4"/>
    <circle cx="228" cy="780" r="2.2"/><circle cx="292" cy="738" r="2.6"/><circle cx="356" cy="750" r="2.2"/><circle cx="398" cy="706" r="2.8"/><circle cx="456" cy="718" r="2.2"/><circle cx="524" cy="676" r="2.5"/><circle cx="560" cy="724" r="2.0"/>
    <circle cx="742" cy="396" r="2.4"/><circle cx="806" cy="352" r="2.2"/><circle cx="870" cy="412" r="2.6"/><circle cx="924" cy="358" r="2.2"/>
    <circle cx="600" cy="780" r="2.1"/><circle cx="648" cy="742" r="2.5"/><circle cx="700" cy="772" r="2.0"/>
    <circle cx="172" cy="182" r="2.1" opacity="0.7"/>
    <circle cx="1030" cy="470" r="2.0"/><circle cx="1110" cy="545" r="2.2"/><circle cx="640" cy="470" r="1.8"/>
  </g>
  <!-- Hviezdice (4-hroté sparkles) -->
  <g fill="#A98A57" stroke="none">
    <path d="M712 168 l2.8 7.6 7.6 2.8 -7.6 2.8 -2.8 7.6 -2.8 -7.6 -7.6 -2.8 7.6 -2.8z" opacity="0.75"/>
    <path d="M560 306 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2z" opacity="0.6"/>
    <path d="M988 706 l2 5.4 5.4 2 -5.4 2 -2 5.4 -2 -5.4 -5.4 -2 5.4 -2z" opacity="0.65"/>
    <path d="M330 520 l1.8 4.8 4.8 1.8 -4.8 1.8 -1.8 4.8 -1.8 -4.8 -4.8 -1.8 4.8 -1.8z" opacity="0.55"/>
    <path d="M820 640 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z" opacity="0.7"/>
