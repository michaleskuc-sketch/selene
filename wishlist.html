<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SELÉNÉ — Wishlist</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FAF6F0;--pearl:#F4EFE6;--champagne:#EDE3D2;--gold:#A98A57;--gold-deep:#8F7245;--ink:#2B2723;--line:rgba(43,39,35,.10);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Jost,sans-serif;background:var(--ivory);color:var(--ink);}
  a{text-decoration:none;color:inherit;}
  button{background:none;border:none;cursor:pointer;}
  header{position:sticky;top:0;z-index:100;background:var(--ivory);border-bottom:1px solid var(--line);}
  .header-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 40px;height:64px;}
  .logo-block{display:flex;flex-direction:column;align-items:center;gap:2px;justify-self:center;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.22em;font-weight:600;}
  .tagline{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);}
  .icons{display:flex;gap:22px;align-items:center;justify-content:flex-end;}
  .icons svg{width:19px;height:19px;}
  .icon-badge{position:absolute;top:-6px;right:-8px;background:var(--gold-deep);color:#fff;font-size:9px;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;}
  .container{max-width:1200px;margin:0 auto;padding:0 40px;}
  .page-title{padding:52px 0 8px;font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;}
  .sub{color:var(--gold);font-size:13px;letter-spacing:.08em;padding-bottom:40px;}
  .empty{text-align:center;padding:80px 0;color:#a89f90;font-size:15px;}
  .empty a{color:var(--gold-deep);text-decoration:underline;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding-bottom:80px;}
  .card{position:relative;}
  .card-img{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--champagne);margin-bottom:14px;}
  .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
  .card-img:hover img{transform:scale(1.04);}
  .rm-wish{position:absolute;top:10px;right:10px;background:rgba(250,246,240,.9);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  .rm-wish svg{width:16px;height:16px;stroke:var(--gold-deep);fill:var(--gold-deep);}
  .p-cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .p-name{font-family:'Cormorant Garamond',serif;font-size:17px;margin-bottom:6px;}
  .price{font-size:14px;color:var(--ink);}
  .btn-add{margin-top:10px;width:100%;padding:10px;font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold-deep);color:var(--gold-deep);cursor:pointer;transition:all .25s;}
  .btn-add:hover{background:var(--gold-deep);color:var(--ivory);}
  @media(max-width:860px){
    .header-inner{display:flex;justify-content:space-between;align-items:center;}
    .logo-block{position:absolute;left:50%;transform:translateX(-50%);z-index:5;}
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:600px){.container{padding:0 18px;}.grid{gap:14px;}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <button class="burger" style="display:none;order:-1" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--ink)"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
      <button class="wish-left" aria-label="Wishlist" onclick="location.href='wishlist.html'" style="position:relative;background:none;border:none;cursor:pointer;color:var(--ink);padding:0;display:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
    </div>
    
    <a href="selene_cd_homepage.html" class="logo-block" aria-label="SELÉNÉ — domov">
      <span class="brand">SELÉNÉ</span>
      <span class="tagline">jewelry</span>
    </a>
    <div class="header-right">
      <div class="icons">
      <button aria-label="Wishlist" style="position:relative;color:var(--gold-deep)">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <a href="selene_cd_kosik.html" aria-label="Košík" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 8h12l-1.2 11.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="icon-badge" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<div class="container">
  <div class="page-title">Wishlist</div>
  <div class="sub" id="wishSub">0 položiek</div>
  <div id="wishGrid" class="grid"></div>
  <div id="wishEmpty" class="empty" style="display:none">Wishlist je prázdny. <a href="selene_cd_katalog.html">Prezrieť katalóg →</a></div>
</div>

<script src="products_v4.js"></script>
<script>
  function getWish(){ try{ return JSON.parse(localStorage.getItem('selene_wish')||'[]'); }catch(e){ return []; } }
  function setWish(w){ localStorage.setItem('selene_wish', JSON.stringify(w)); }
  function getCart(){ try{ return JSON.parse(localStorage.getItem('selene_cart')||'[]'); }catch(e){ return []; } }
  function setCart(c){ localStorage.setItem('selene_cart', JSON.stringify(c)); }

  function removeWish(id){
    var w = getWish().filter(function(x){ return x !== id; });
    setWish(w); render();
  }
  function addCart(id){
    var c = getCart(); var f = c.find(function(i){ return i.id === id; });
    if(f){ f.qty += 1; } else { c.push({id:id,qty:1}); }
    setCart(c);
    var btn = document.querySelector('[data-add="'+id+'"]');
    if(btn){ btn.textContent = 'Pridané ✓'; btn.disabled = true; }
  }

  var COLLS = {\"sun-gold\":\"Sun Gold\",\"moon-silver\":\"Moon Silver\"};
  function render(){
    var w = getWish();
    var sub = document.getElementById('wishSub');
    var grid = document.getElementById('wishGrid');
    var empty = document.getElementById('wishEmpty');
    var cart = document.getElementById('cartCount');
    var cc = getCart().reduce(function(s,i){ return s+i.qty; },0);
    if(cart) cart.textContent = cc;
    sub.textContent = w.length + (w.length === 1 ? ' položka' : w.length < 5 ? ' položky' : ' položiek');
    if(!w.length){ grid.innerHTML = ''; empty.style.display = ''; return; }
    empty.style.display = 'none';
    var html = '';
    w.forEach(function(id){
      var p = PRODUCTS.find(function(x){ return x.id === id; });
      if(!p) return;
      html += '<div class="card">' +
        '<div class="card-img">' +
          '<a href="selene_cd_produkt.html?id='+p.id+'"><img src="'+p.img+'" alt="'+p.n+'"></a>' +
          '<button class="rm-wish" onclick="removeWish('+p.id+')" title="Odstrániť z wishlistu"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M18 6L6 18M6 6l12 12"/></svg></button>' +
        '</div>' +
        '<div class="p-cat">'+(COLLS[p.k]||'')+'</div>' +
        '<a href="selene_cd_produkt.html?id='+p.id+'"><div class="p-name">'+p.n+'</div></a>' +
        '<div class="price">'+p.c+' €</div>' +
        '<button class="btn-add" data-add="'+p.id+'" onclick="addCart('+p.id+')">Pridať do košíka</button>' +
      '</div>';
    });
    grid.innerHTML = html;
  }
  render();
</script>
</body>
</html>
